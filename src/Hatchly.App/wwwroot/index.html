<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hatchly - ARK: Survival Ascended Raise Planner</title>
    <meta name="description" content="Plan ASA creature maturation, capacity-based baby feeding, and shared trough coverage." />
    <meta name="theme-color" content="#071512" />
    <meta property="og:image" content="https://hatchlyapp.com/images/hatchly-logo.png" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="images/hatchly-logo.png" />
    <link rel="apple-touch-icon" href="images/hatchly-logo.png" />
    <link href="Hatchly.App.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#215;</span>
    </div>
    <script src="js/app-storage.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        (async () => {
            try {
                if ("serviceWorker" in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(registration => registration.unregister()));
                }

                if ("caches" in window) {
                    const keys = await caches.keys();
                    await Promise.all(
                        keys
                            .filter(key => key.startsWith("offline-cache-"))
                            .map(key => caches.delete(key)));
                }
            } finally {
                await Blazor.start();
            }
        })().catch(error => {
            console.error("Hatchly failed to start.", error);
            const app = document.getElementById("app");
            if (app) {
                app.innerHTML = `
                    <main style="max-width:42rem;margin:12vh auto;padding:1.5rem;color:#f4f6f7;font-family:system-ui">
                        <h1>Hatchly could not start</h1>
                        <p style="color:#aab4be">Reload the page. If this continues, clear this site's stored data and try again.</p>
                        <pre style="white-space:pre-wrap;color:#ffb85c">${String(error)}</pre>
                    </main>`;
            }
        });
    </script>
</body>

</html>
