<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hatchly - ARK: Survival Ascended Raise Planner</title>
    <meta name="description" content="Plan ASA creature maturation, capacity-based baby feeding, and shared trough coverage." />
    <meta name="theme-color" content="#071512" />
    <meta property="og:image" content="https://hatchlyapp.com/images/hatchly-logo.png" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="images/hatchly-logo.png" />
    <link rel="apple-touch-icon" href="images/hatchly-logo.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#215;</span>
    </div>
    <script src="js/app-storage.js"></script>
    <script>
        window.addEventListener("load", () => {
            void (async () => {
                if ("serviceWorker" in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(registration => registration.unregister()));
                }

                if ("caches" in window) {
                    const keys = await caches.keys();
                    await Promise.all(
                        keys
                            .filter(key => key.startsWith("offline-cache-"))
                            .map(key => caches.delete(key)));
                }
            })().catch(error => {
                console.warn("Hatchly could not clear legacy offline data.", error);
            });
        });
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
