name: Sync official rates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hatchly-rate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet restore Hatchly.slnx

      - name: Synchronize official ASA rates
        run: >
          dotnet run --project tools/Hatchly.Tools --no-restore --
          sync-rates
          --output src/Hatchly.App/wwwroot/data/official-rates.json

      - name: Commit changed rate values
        shell: bash
        run: |
          if git diff --quiet -- src/Hatchly.App/wwwroot/data/official-rates.json; then
            echo "Official rates are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/Hatchly.App/wwwroot/data/official-rates.json
          git commit -m "chore(data): sync official ASA rates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
