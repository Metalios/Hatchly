name: Deploy Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hatchly-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore Hatchly.slnx

      - name: Validate generated application data
        run: >
          dotnet run --project tools/Hatchly.Tools --no-restore --
          validate-data
          --data-dir src/Hatchly.App/wwwroot/data

      - name: Merge application data
        run: >
          dotnet run --project tools/Hatchly.Tools --no-restore --
          merge-data
          --data-dir src/Hatchly.App/wwwroot/data
          --output src/Hatchly.App/wwwroot/data/catalog.json

      - name: Test
        run: dotnet test Hatchly.slnx --no-restore --configuration Release

      - name: Publish Blazor WebAssembly
        run: >
          dotnet publish src/Hatchly.App/Hatchly.App.csproj
          --no-restore
          --configuration Release
          --output publish

      - name: Prepare custom-domain Pages build
        shell: bash
        run: |
          transformed_index="$(find src/Hatchly.App/obj/Release/net10.0/staticwebassets/htmlassetplaceholders/publish -type f -name '*.html' -print -quit)"
          if [[ -z "$transformed_index" ]]; then
            echo "The transformed Blazor index was not generated." >&2
            exit 1
          fi
          dotnet run --project tools/Hatchly.Tools --configuration Release --no-build -- \
            prepare-pages \
            --publish-path publish \
            --intermediate-index "$transformed_index" \
            --base-path "/"

      - name: Audit published payload
        run: >
          dotnet run --project tools/Hatchly.Tools --configuration Release --no-build --
          audit-publish
          --path publish

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
