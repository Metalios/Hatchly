name: Deploy Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hatchly-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore Hatchly.slnx

      - name: Validate generated application data
        run: >
          dotnet run --project tools/Hatchly.Tools --no-restore --
          validate-data
          --data-dir src/Hatchly.App/wwwroot/data

      - name: Merge application data
        run: >
          dotnet run --project tools/Hatchly.Tools --no-restore --
          merge-data
          --data-dir src/Hatchly.App/wwwroot/data
          --output src/Hatchly.App/wwwroot/data/catalog.json

      - name: Test
        run: dotnet test Hatchly.slnx --no-restore --configuration Release

      - name: Publish Blazor WebAssembly
        run: >
          dotnet publish src/Hatchly.App/Hatchly.App.csproj
          --no-restore
          --configuration Release
          --output publish

      - name: Prepare custom-domain Pages build
        shell: bash
        run: |
          transformed_index="$(find src/Hatchly.App/obj/Release/net10.0/staticwebassets/htmlassetplaceholders/publish -type f -name '*.html' -print -quit)"
          if [[ -z "$transformed_index" ]]; then
            echo "The transformed Blazor index was not generated." >&2
            exit 1
          fi
          dotnet run --project tools/Hatchly.Tools --configuration Release --no-build -- \
            prepare-pages \
            --publish-path publish \
            --intermediate-index "$transformed_index" \
            --base-path "/"

      - name: Audit published payload
        run: >
          dotnet run --project tools/Hatchly.Tools --configuration Release --no-build --
          audit-publish
          --path publish

      - name: Publish static site to gh-pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf 'hatchlyapp.com\n' > publish/wwwroot/CNAME

          site_dir="$(mktemp -d)"
          cp -a publish/wwwroot/. "$site_dir"/

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              gh-pages
          else
            git init gh-pages
            git -C gh-pages checkout --orphan gh-pages
            git -C gh-pages remote add origin \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          rsync -a --delete --exclude .git "$site_dir"/ gh-pages/
          git -C gh-pages config user.name "github-actions[bot]"
          git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gh-pages add -A

          if git -C gh-pages diff --cached --quiet; then
            echo "Published site is unchanged."
            exit 0
          fi

          git -C gh-pages commit -m "deploy: publish Hatchly site"
          git -C gh-pages push origin HEAD:gh-pages
